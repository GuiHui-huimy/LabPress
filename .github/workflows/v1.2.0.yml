name: v1.2.0 smoke

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'includes/**'
      - 'migrations/**'
      - 'bin/**'
      - 'tests/**'
      - 'plugins/**'
      - '.github/workflows/v1.2.0.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'includes/**'
      - 'migrations/**'
      - 'bin/**'
      - 'tests/**'
      - 'plugins/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: labpress_test
          MARIADB_USER: labpress
          MARIADB_PASSWORD: labpress_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, zip, curl
          coverage: none

      - name: Configure site
        run: |
          cat > storage/config/site.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => '127.0.0.1',
                  'name' => 'labpress_test',
                  'user' => 'labpress',
                  'pass' => 'labpress_test_pw',
                  'charset' => 'utf8mb4',
              ],
              'timezone' => 'Asia/Shanghai',
              'debug' => true,
              'session' => ['name' => '', 'same_site' => 'Lax', 'secure' => null],
          ];
          PHP

      - name: Import example database (MariaDB collation compatibility)
        run: |
          sed 's/utf8mb4_0900_ai_ci/utf8mb4_unicode_ci/g' labpressexample.sql > /tmp/labpress.sql
          mysql -h 127.0.0.1 -uroot -proot labpress_test < /tmp/labpress.sql

      - name: PHP syntax
        run: |
          find core includes migrations bin tests plugins -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Migrations
        run: |
          php bin/migrate.php status
          php bin/migrate.php up
          php bin/migrate.php status

      - name: Smoke tests
        run: php tests/smoke.php

      - name: HTTP smoke
        run: |
          php -S 127.0.0.1:8090 -t . > /tmp/php-server.log 2>&1 &
          sleep 2
          curl -fsS -o /tmp/index.html -w 'index=%{http_code} size=%{size_download}\n' http://127.0.0.1:8090/index.php
          curl -fsS -o /tmp/login.html -w 'login=%{http_code} size=%{size_download}\n' http://127.0.0.1:8090/admin/login.php
          test -s /tmp/index.html
          test -s /tmp/login.html

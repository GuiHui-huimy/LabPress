name: v1.2.0 smoke

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'includes/**'
      - 'install/**'
      - 'install.php'
      - 'migrations/**'
      - 'bin/**'
      - 'tests/**'
      - 'plugins/**'
      - '.github/workflows/v1.2.0.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'includes/**'
      - 'install/**'
      - 'install.php'
      - 'migrations/**'
      - 'bin/**'
      - 'tests/**'
      - 'plugins/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: labpress_test
          MARIADB_USER: labpress
          MARIADB_PASSWORD: labpress_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, zip, curl
          coverage: none

      - name: Install LabPress into an empty database
        run: |
          php bin/install.php \
            --db-host=127.0.0.1 \
            --db-port=3306 \
            --db-name=labpress_test \
            --db-user=root \
            --db-pass=root \
            --site-url=http://127.0.0.1:8090 \
            --site-name='LabPress CI' \
            --admin-username=admin \
            --admin-password='ci_admin_password' \
            --demo

      - name: PHP syntax
        run: |
          find core includes install migrations bin tests plugins -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          php -l install.php
          php -l admin/views/dashboard.php

      - name: Migrations
        run: |
          php bin/migrate.php status
          php bin/migrate.php up
          php bin/migrate.php status

      - name: Smoke tests
        run: php tests/smoke.php

      - name: HTTP smoke
        run: |
          php -S 127.0.0.1:8090 -t . > /tmp/php-server.log 2>&1 &
          sleep 2
          curl -fsS -o /tmp/index.html -w 'index=%{http_code} size=%{size_download}\n' http://127.0.0.1:8090/index.php
          curl -fsS -o /tmp/login.html -w 'login=%{http_code} size=%{size_download}\n' http://127.0.0.1:8090/admin/login.php
          curl -fsS -o /tmp/install.html -w 'install=%{http_code} size=%{size_download}\n' http://127.0.0.1:8090/install.php
          curl -fsS -o /dev/null -w 'echarts=%{http_code} size=%{size_download}\n' http://127.0.0.1:8090/admin/assets/js/echarts.min.js
          test -s /tmp/index.html
          test -s /tmp/login.html
          test -s /tmp/install.html
          grep -q '已安装' /tmp/install.html
